<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page use the notch area; safe-area insets keep controls clear of it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- The double-underscore placeholders are filled from src/config and src/ui/strings.ts at build time (scripts/htmlValuesPlugin.ts). -->

    <meta name="theme-color" content="#f6e9d2" />
    <style>:root{--color-background:#f6e9d2}html,body{background:var(--color-background)}</style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Silhouette" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Silhouette</title>
    <script type="module" crossorigin src="/silhouette/assets/index-CMpmaTIr.js"></script>
    <link rel="stylesheet" crossorigin href="/silhouette/assets/index-iaAxMoAa.css">
  <link rel="manifest" href="/silhouette/manifest.webmanifest"></head>
  <body>
    <div id="app"></div>
  </body>
</html>
